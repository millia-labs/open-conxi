name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/lint.py
      - run: bash scripts/build-zips.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: "Thirteen Claude skills for hotels. Claude Code without a terminal: download open-conxi-installer.zip and double-click the installer inside. claude.ai: upload the single-skill zips under Customize, Skills. Run order: hotel-setup, hotel-dashboard, then the rest; hotel-routine runs the day."
